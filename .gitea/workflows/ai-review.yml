name: AI Code & SQL Review

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  ai-review:
    runs-on: linux_amd64
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 1. 提取本次 PR 的变更文件（仅 .cs 和 .sql）
      # 先 fetch 两个 commit（depth=1 极快），再 diff，避免本地缺少对象导致静默失败
      - name: Prepare changed files
        id: changes
        run: |
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          echo "BASE_SHA=$BASE_SHA, HEAD_SHA=$HEAD_SHA"

          # 确保两个 commit 对象在本地存在
          git fetch origin --depth=1 "$BASE_SHA" 2>&1 || echo "WARN: fetch base sha failed"
          git fetch origin --depth=1 "$HEAD_SHA" 2>&1 || echo "WARN: fetch head sha failed"

          # 列出已 fetch 的 commit 用于调试
          git cat-file -t "$BASE_SHA" 2>&1 || echo "BASE_SHA not found locally"
          git cat-file -t "$HEAD_SHA" 2>&1 || echo "HEAD_SHA not found locally"

          # 关闭路径引用/转义，确保中文路径不被加引号和八进制转义
          git config core.quotePath false

          # 比较变更（2>&1 暴露错误，不静默吞掉）
          git diff --name-only "$BASE_SHA" "$HEAD_SHA" > all_changes.txt 2>&1
          echo "=== all_changes ==="
          cat all_changes.txt
          echo "=== end ==="

          # 过滤 .cs 和 .sql（去掉引号兼容，尽管 quotePath=false 后不再加引号）
          if [ -s all_changes.txt ]; then
            tr -d '"' < all_changes.txt | grep -E '\.(cs|sql)$' > changed_files.txt || true
          fi

          if [ ! -s changed_files.txt ]; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "No .cs or .sql files changed, skipping AI review."
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
            cat changed_files.txt
          fi

      # 2. 生成两分支的 git diff 差异内容并打包成 JSON（用 Python 构建，保留换行结构）
      - name: Build review payload
        if: steps.changes.outputs.has_changes == 'true'
        id: payload
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.number }}
        run: |
          python3 -c "
          import json, subprocess, os
          base = os.environ['BASE_SHA']
          head = os.environ['HEAD_SHA']
          with open('changed_files.txt') as f:
              changed_files = [l.strip() for l in f if l.strip()]
          has_sql = any(fp.endswith('.sql') for fp in changed_files)
          review_type = 'sql' if has_sql else 'code'
          print(f'Review type: {review_type}')
          files = []
          for fp in changed_files:
              r = subprocess.run(['git', 'diff', base, head, '--', fp], capture_output=True, text=True)
              if r.stdout.strip():
                  files.append({'path': fp, 'content': r.stdout, 'change_type': 'diff'})
          payload = {'type': review_type, 'repo': os.environ['REPO'], 'pr_number': int(os.environ['PR_NUMBER']), 'files': files}
          with open('request.json', 'w', encoding='utf-8') as f:
              json.dump(payload, f, ensure_ascii=False)
          print(f'Payload built: {len(files)} file(s), type={review_type}')
          "
          echo "payload_file=request.json" >> $GITHUB_OUTPUT

      # 2.5 调试：打印实际发送的请求体（确认入参正确）
      - name: Debug request payload
        if: steps.changes.outputs.has_changes == 'true'
        run: |
          echo "=== Request JSON (first 2000 chars) ==="
          head -c 2000 request.json
          echo ""
          echo "=== JSON validation ==="
          python3 -m json.tool request.json > /dev/null 2>&1 && echo "JSON OK" || echo "JSON INVALID"
          echo "=== Request file size ==="
          wc -c request.json

      # 3. 调用 AI Review API
      - name: Call AI Review API
        if: steps.changes.outputs.has_changes == 'true'
        id: ai_call
        run: |
          # 去掉 Secret URL 末尾的斜杠，防止双斜杠导致 404
          API_URL="${{ secrets.AI_REVIEW_API_URL }}"
          API_URL="${API_URL%/}"
          echo "Calling API: ${API_URL}/api/review"

          RESPONSE=$(curl -sS -X POST "${API_URL}/api/review" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${{ secrets.AI_REVIEW_TOKEN }}" \
            -H "Expect:" \
            -d @${{ steps.payload.outputs.payload_file }} \
            --max-time 300 2>/tmp/curl_stderr.log)
          
          echo "Raw response body:"
          echo "$RESPONSE"

          # 写入文件供后续步骤读取（避免 GITHUB_OUTPUT 多行问题）
          echo "$RESPONSE" > /tmp/ai_response.json

          # 同时尝试写入 GITHUB_OUTPUT
          {
            echo "result<<EOF"
            echo "$RESPONSE"
            echo "EOF"
          } >> $GITHUB_OUTPUT

      # 4. 打印结果到 CI 日志（并设置检查状态）
      - name: Report results
        if: steps.changes.outputs.has_changes == 'true'
        run: |
          # 优先从文件读取响应（避免 GITHUB_OUTPUT 多行问题）
          if [ -f /tmp/ai_response.json ]; then
            RESULT=$(cat /tmp/ai_response.json)
          else
            RESULT='${{ steps.ai_call.outputs.result }}'
          fi

          echo "Response length: ${#RESULT}"

          # 尝试用 python3 解析评分（Runner 没有 jq）
          SCORE=$(echo "$RESULT" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('score','N/A'))" 2>/dev/null || echo "N/A")
          ISSUES=$(echo "$RESULT" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('total_issues',0))" 2>/dev/null || echo "0")

          echo "========================================"
          echo "AI 审查评分: ${SCORE}/100"
          echo "发现问题: ${ISSUES} 个"
          echo "========================================"
          echo "完整结果:"
          echo "$RESULT"
          echo "========================================"

          # 将报告写入 Step Summary，工作流页面直接可看
          echo "$RESULT" | python3 -c "import sys,json;print(json.load(sys.stdin).get('report_markdown',''))" >> $GITHUB_STEP_SUMMARY

          # 合并门禁：代码已保留，但默认不启用（直接 exit 0）
          # 如需强制，取消下面注释并改为 exit 1
          # if [ "$SCORE" != "N/A" ] && [ "$SCORE" -lt 60 ]; then
          #   echo "评分低于 60，标记失败"
          #   exit 1
          # fi
          exit 0

      # 5. 将结果评论到 PR（使用 Gitea API）
      - name: Comment PR
        if: steps.changes.outputs.has_changes == 'true'
        run: |
          # 优先从文件读取响应
          if [ -f /tmp/ai_response.json ]; then
            RESULT=$(cat /tmp/ai_response.json)
          else
            RESULT='${{ steps.ai_call.outputs.result }}'
          fi

          SCORE=$(echo "$RESULT" | python3 -c "import sys,json; print(json.load(sys.stdin).get('score','N/A'))" 2>/dev/null || echo "N/A")
          ISSUES=$(echo "$RESULT" | python3 -c "import sys,json; print(json.load(sys.stdin).get('total_issues',0))" 2>/dev/null || echo "0")
          MARKDOWN=$(echo "$RESULT" | python3 -c "import sys,json; print(json.load(sys.stdin).get('report_markdown',''))" 2>/dev/null || echo "")

          # 直接用 API 返回的报告 Markdown，本身已包含标题和评分
          echo "${MARKDOWN}" > /tmp/body.txt

          # 用 python3 构建 JSON，避免 shell 引号转义问题
          python3 -c 'import json; print(json.dumps({"body": open("/tmp/body.txt").read()}))' > /tmp/comment.json

          # 使用 Gitea API 评论到 PR（secret 应为完整 URL，如 https://git.shijizhongyun.com）
          curl -s -X POST "${{ secrets.AI_GITEA_API_URL }}/api/v1/repos/${{ github.repository }}/issues/${{ github.event.number }}/comments" \
            -H "Content-Type: application/json" \
            -H "Authorization: token ${{ secrets.AI_GITEA_TOKEN }}" \
            -d @/tmp/comment.json 2>&1 || echo "PR comment failed (maybe AI_GITEA_TOKEN not set)"
