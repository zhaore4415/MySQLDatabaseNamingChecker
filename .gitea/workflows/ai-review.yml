name: AI Code & SQL Review

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  ai-review:
    runs-on: linux_amd64
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 1. 提取本次 PR 的变更文件（仅 .cs 和 .sql）
      - name: Prepare changed files
        id: changes
        run: |
          git diff --name-only origin/${{ github.base_ref }}...HEAD | grep -E '\.(cs|sql)$' > changed_files.txt || true
          if [ ! -s changed_files.txt ]; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "No .cs or .sql files changed, skipping AI review."
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi

      # 2. 读取文件内容并打包成 JSON
      - name: Build review payload
        if: steps.changes.outputs.has_changes == 'true'
        id: payload
        run: |
          FILES_JSON="["
          while IFS= read -r file; do
            if [ -f "$file" ]; then
              # 转义双引号和反斜杠，换行转空格，避免 JSON 解析失败
              CONTENT=$(cat "$file" | sed 's/\\/\\\\/g' | sed 's/"/\\"/g' | tr '\n' ' ' | sed 's/  */ /g')
              FILES_JSON="${FILES_JSON}{\"path\":\"$file\",\"content\":\"$CONTENT\",\"change_type\":\"modified\"},"
            fi
          done < changed_files.txt
          FILES_JSON=$(echo "$FILES_JSON" | sed 's/,$//')
          FILES_JSON="${FILES_JSON}]"

          # 根据文件类型自动判断审查类型
          if grep -q '\.sql$' changed_files.txt; then
            REVIEW_TYPE="sql"
          else
            REVIEW_TYPE="code"
          fi
          echo "Review type: ${REVIEW_TYPE}"

          # 构建完整请求体
          echo "{\"type\":\"${REVIEW_TYPE}\",\"repo\":\"${{ github.repository }}\",\"pr_number\":${{ github.event.number }},\"files\":$FILES_JSON}" > request.json
          echo "payload_file=request.json" >> $GITHUB_OUTPUT

      # 3. 调用 AI Review API
      - name: Call AI Review API
        if: steps.changes.outputs.has_changes == 'true'
        id: ai_call
        run: |
          echo "Testing connectivity to API..."
          ping -c 1 10.10.33.39 || echo "Ping failed"
          curl -v http://10.10.33.39:41136/api/review --max-time 10 || echo "Curl failed"
          
          RESPONSE=$(curl -v -X POST "${{ secrets.AI_REVIEW_API_URL }}/api/review" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${{ secrets.AI_REVIEW_TOKEN }}" \
            -d @${{ steps.payload.outputs.payload_file }} \
            --max-time 300 2>&1)
          
          echo "Raw response length: ${#RESPONSE}"
          echo "Raw response:"
          echo "$RESPONSE"
          
          # 写入文件供后续步骤读取（避免 GITHUB_OUTPUT 多行问题）
          echo "$RESPONSE" > /tmp/ai_response.json
          
          # 同时尝试写入 GITHUB_OUTPUT
          {
            echo "result<<EOF"
            echo "$RESPONSE"
            echo "EOF"
          } >> $GITHUB_OUTPUT



      # 4. 打印结果到 CI 日志（并设置检查状态）
      - name: Report results
        if: steps.changes.outputs.has_changes == 'true'
        run: |
          # 优先从文件读取响应（避免 GITHUB_OUTPUT 多行问题）
          if [ -f /tmp/ai_response.json ]; then
            RESULT=$(cat /tmp/ai_response.json)
          else
            RESULT='${{ steps.ai_call.outputs.result }}'
          fi
          
          echo "Response length: ${#RESULT}"
          
          # 尝试用 python3 解析评分（Runner 没有 jq）
          SCORE=$(echo "$RESULT" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('score','N/A'))" 2>/dev/null || echo "N/A")
          ISSUES=$(echo "$RESULT" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('total_issues',0))" 2>/dev/null || echo "0")
          
          echo "========================================"
          echo "AI 审查评分: ${SCORE}/100"
          echo "发现问题: ${ISSUES} 个"
          echo "========================================"
          echo "完整结果:"
          echo "$RESULT"
          echo "========================================"

          # 合并门禁：代码已保留，但默认不启用（直接 exit 0）
          # 如需强制，取消下面注释并改为 exit 1
          # if [ "$SCORE" != "N/A" ] && [ "$SCORE" -lt 60 ]; then
          #   echo "评分低于 60，标记失败"
          #   exit 1
          # fi
          exit 0

